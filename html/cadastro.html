        <h1>Cadastro</h1>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">

        <label for="menu-toggle" class="menu-hamburguer">
            ☰ Menu

        <nav class="menu-principal" aria-label="Navegação principal">
            <a href="index.html">Início</a>

            <div class="projetos-menu">
                <a href="projetos.html" class="projetos-link">Projetos</a>

                    <details class="item-dropdown">
                        <summary aria-label="Abrir submenu de Projetos">▼</summary>

                        </div>
                    </details>

            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Formulário de Cadastro</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Dados pessoais</legend>
                    <div>
                        <label for="nome">Nome completo:</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div>
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                            title="Formato: 000.000.000-00" required>
                    </div>
                    <div>
                        <label for="data-nascimento">Data de nascimento:</label>
                        <input type="date" id="data-nascimento" name="data_nascimento" required>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Contato</legend>
                    <div>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                            title="Formato: (00) 00000-0000" required>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Endereço</legend>
                    <div>
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" name="endereco" required>
                    </div>
                    <div>
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}" title="Formato: 00000-000"
                            required>
                    </div>

                    <div>
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>
                    <div>
                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" name="estado" required>
                    </div>
                </fieldset>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>

    </footer>
</body>

</html>
